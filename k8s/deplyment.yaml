apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-monitor
spec:
  replicas: 2

  selector:
    matchLabels:
      app: integration-monitor

  template:
    metadata:
      labels:
        app: integration-monitor

    spec:
      containers:
        - name: integration-monitor
          image: ghcr.io/joseph21xd/integration-monitor:137f3129cc30b23109965903daebce6b3b56005c
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: integration-monitor-config

            - secretRef:
                name: integration-monitor-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10