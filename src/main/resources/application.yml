spring:
  application:
    name: integration-monitor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.integration.monitor: INFO
  file:
    name: /app/logs/integration-monitor.log

integration:
  monitor:
    max-retry-attempts: 3
    timeout-seconds: 30
    environment: default

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    environment: ${integration.monitor.environment}


