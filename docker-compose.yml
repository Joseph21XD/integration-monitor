services:

  mysql:
    image: mysql
    container_name: mysql-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - integration-mysql-data:/var/lib/mysql
    networks:
      - integration-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  integration-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: integration-monitor:1.0
    container_name: integration-monitor
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - integration-monitor-logs:/app/logs
    networks:
      - integration-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: integration-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      integration-monitor:
        condition: service_healthy
    networks:
      - integration-network

  prometheus:
    image: prom/prometheus:latest
    container_name: integration-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      integration-monitor:
        condition: service_healthy
    networks:
      - integration-network

  grafana:
    image: grafana/grafana:latest
    container_name: integration-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - integration-network

volumes:
  integration-mysql-data:
  integration-monitor-logs:
  prometheus-data:
  grafana-data:

networks:
  integration-network: